<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE EXCHANGE</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #d1d1d1;
            --accent-color: #ff0000;
            /* A sharp, surgical red */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: crosshair;
        }

        /* Subtle grain effect to make it feel "analog" and unsettling */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Resolution_White_Noise_Video_Frame.png');
            opacity: 0.03;
            pointer-events: none;
        }

        #manifesto {
            font-size: 1.2rem;
            letter-spacing: 0.2rem;
            margin-bottom: 3rem;
            text-align: center;
            text-transform: uppercase;
            animation: flicker 4s infinite;
        }

        .payment-container {
            border: 1px solid #333;
            padding: 40px;
            width: 300px;
            transition: all 0.5s ease;
        }

        .payment-container:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }

        .price-tag {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        button {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 15px 30px;
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        button:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        a.relinquish-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 15px 30px;
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            text-align: center;
        }

        a.relinquish-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .disclaimer {
            margin-top: 2rem;
            font-size: 0.6rem;
            color: #444;
            max-width: 250px;
            text-align: center;
            line-height: 1.5;
        }

        @keyframes flicker {
            0% {
                opacity: 1;
            }

            5% {
                opacity: 0.8;
            }

            10% {
                opacity: 1;
            }

            100% {
                opacity: 1;
            }
        }

        /* Small visual glitch on the dollar sign */
        .glitch {
            position: relative;
            display: inline-block;
        }
    </style>
</head>

<body>

    <div id="manifesto">
        Submit a single unit of currency.<br>
        Nothing will happen.
    </div>

    <div class="payment-container">
        <div class="price-tag">$1.00</div>

        <!-- <button onclick="alert('The transaction is a ghost.')">RELINQUISH</button> -->
        <a class="relinquish-btn" href="https://buy.stripe.com/test_8x2cN4cDZ3Xtask5rM0RG00" target="_blank">RELINQUISH</a>
    </div>

    <div class="disclaimer">
        BY CLICKING, YOU ACKNOWLEDGE THAT NO GOODS, OR SERVICES WILL BE PROVIDED. THE DOLLAR IS GONE. YOU ARE HERE.
    </div>

</body>

</html>
